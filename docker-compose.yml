version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sports_stats.db
    volumes:
      - ./backend/sports_stats.db:/app/sports_stats.db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
